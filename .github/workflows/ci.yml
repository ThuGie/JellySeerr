name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"
      - name: Build
        run: dotnet build JellySeerr.sln --configuration Release
      - name: Test
        run: dotnet test JellySeerr.sln --configuration Release --no-build
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check browser scripts
        run: |
          node --check src/Jellyfin.Plugin.JellySeerr/Inject/jellyseerr-modal.js
          node --check src/Jellyfin.Plugin.JellySeerr/Inject/jellyseerr-user-tools.js
          node --check src/Jellyfin.Plugin.JellySeerr/Inject/jellyseerr-requests.js
          node --check src/Jellyfin.Plugin.JellySeerr/Inject/jellyseerr-calendar.js
          node --check src/Jellyfin.Plugin.JellySeerr/Inject/jellyseerr-tabs.js
      - name: Test release picker
        run: |
          npm ci --prefix tests/ui
          npm test --prefix tests/ui
